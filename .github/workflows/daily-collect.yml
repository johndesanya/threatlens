name: Collect threat intel
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild everything from scratch (leave empty for a normal run)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Collect
        env:
          FULL: ${{ github.event.inputs.full }}
        run: node collector/collect.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "threatlens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data site/iocs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "chore: refresh threat intel $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push

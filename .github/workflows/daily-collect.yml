name: Daily threat-intel collection
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node collector/collect.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "threatlens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data site/iocs
          git diff --cached --quiet || git commit -m "chore: refresh threat intel $(date -u +%F)"
          git push

name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"      # weekly
  workflow_dispatch:
# read-only: this workflow can never change the repository
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: No secrets or tokens in the repository
        run: |
          if grep -rEI --exclude-dir=.git --exclude-dir=iocs --exclude-dir=data \
               -e 'ghp_[A-Za-z0-9]{30,}' -e 'github_pat_[A-Za-z0-9_]{40,}' -e 'gho_[A-Za-z0-9]{30,}' \
               -e 'AKIA[0-9A-Z]{16}' -e 'xox[baprs]-[A-Za-z0-9-]{10,}' -e 'rnd_[A-Za-z0-9]{20,}' \
               -e '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' . ; then
            echo "::error::a token or private key looks like it was committed - revoke it NOW and remove it"; exit 1
          fi
          echo "no secrets found"
      - name: Front-end safety rules (no eval, no inline handlers, CSP present)
        run: |
          if grep -nE '\beval\(|new Function\(|document\.write|\.outerHTML *=|javascript:|on(click|error|load|mouseover)=' site/app.js site/index.html; then
            echo "::error::unsafe construct in the front-end"; exit 1
          fi
          grep -q "Content-Security-Policy" site/index.html
          grep -q "default-src 'none'" site/index.html
          if grep -nE '<script[^>]*src=["'"'"']?https?:' site/index.html; then echo "::error::external script"; exit 1; fi
          echo "front-end rules ok"
      - name: The collector stays dependency-free (supply-chain)
        run: |
          test ! -f package.json && test ! -f package-lock.json && echo "no package manifest" || { echo "::error::unexpected package manifest"; exit 1; }
      - name: Workflows only use pinned actions
        run: |
          if grep -hE '^\s*-?\s*uses:\s' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}'; then
            echo "::error::an action is not pinned to a commit hash"; exit 1
          fi
          echo "all actions pinned"
